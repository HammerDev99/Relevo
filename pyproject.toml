[project]
name = "relevo"
version = "0.1.0"
description = "Sistema de gestión de ausencias (vacaciones y permisos) para dependencia judicial - cálculo de festivos colombianos y días hábiles"
requires-python = ">=3.12"
dependencies = [
    "holidays>=0.97",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "sqlalchemy>=2.0",
    "bcrypt>=4.2",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.0",
    "pydantic[email]>=2.0",
    "streamlit>=1.35",
    "httpx>=0.27",
    "streamlit-extras>=0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "ruff>=0.15",
    "mypy>=2.1",
    "httpx>=0.28",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-x -q"

# SPEC-S19-C1: la cobertura se mide sobre el código verificable.
# La capa GUI (Streamlit) se omite: requiere AppTest o Playwright, fuera del
# alcance actual (AUDIT_11 H22). Medir el total con la GUI dentro daría un 40%
# que no refleja la verificación real del backend.
[tool.coverage.run]
source = ["src"]
omit = [
    "src/app/gui/*",
    "src/relevo/__main__.py",
]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
namespace_packages = true
mypy_path = "src"
