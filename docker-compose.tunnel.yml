services:
  relevo-api:
    build: .
    environment:
      - RELEVO_MODE=api
      - DATABASE_URL=sqlite:////app/data/database/relevo.db
      - SECRET_KEY=demo-secret-key-123
      - TZ=America/Bogota
    volumes:
      - ./data:/app/data

  relevo-gui:
    build: .
    environment:
      - RELEVO_MODE=gui
      - DATABASE_URL=sqlite:////app/data/database/relevo.db
      - SECRET_KEY=demo-secret-key-123
      - TZ=America/Bogota
    depends_on:
      - relevo-api
    volumes:
      - ./data:/app/data

  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --url http://relevo-gui:8501
    depends_on:
      - relevo-gui
