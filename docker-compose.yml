services:
  relevo-api:
    build: .
    image: relevo-app:v1
    environment:
      - RELEVO_MODE=api
      - DATABASE_URL=sqlite:////app/data/database/relevo.db
      - SECRET_KEY=${SECRET_KEY}
      # AUDIT-H7: contrasena inicial de coordinacion, nunca en el codigo
      - RELEVO_SEED_PASSWORD=${RELEVO_SEED_PASSWORD}
      - TZ=America/Bogota
    volumes:
      - relevo_data:/app/data
      - relevo_logs:/app/logs
    restart: unless-stopped

  relevo-gui:
    build: .
    image: relevo-app:v1
    ports:
      - "8501:8501"
    environment:
      - RELEVO_MODE=gui
      - DATABASE_URL=sqlite:////app/data/database/relevo.db
      - SECRET_KEY=${SECRET_KEY}
      - TZ=America/Bogota
    volumes:
      - relevo_data:/app/data
      - relevo_logs:/app/logs
    depends_on:
      - relevo-api
    restart: unless-stopped

volumes:
  relevo_data:
  relevo_logs:
